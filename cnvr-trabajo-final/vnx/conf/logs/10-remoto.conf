# rsyslog: servidor de logs centralizado (trabajo final CNVR)
# Escucha en UDP y TCP 514 y guarda cada origen en su propio fichero.
module(load="imudp")
input(type="imudp" port="514")
module(load="imtcp")
input(type="imtcp" port="514")

template(name="PorOrigen" type="string" string="/var/log/remoto/%HOSTNAME%.log")
if $fromhost-ip != '127.0.0.1' then {
  action(type="omfile" dynaFile="PorOrigen")
  stop
}
